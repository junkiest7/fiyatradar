services:
  - type: web
    name: fiyatradar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TIMEZONE
        value: Europe/Istanbul
      - key: SERPER_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
